name: Prothom Alo Opinion RSS

on:
  schedule:
    - cronhsshsh: "0 * * * *"   # every hour on the hour
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit & push opinion.xml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opinion.xml
          # Only commit if the file actually changed
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore: update opinion.xml [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push